services:
  mysql:
    image: mysql:8.0
    container_name: ebank-mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: E-BANK
    ports:
      - "3306:3306"
    volumes:
      - ebank_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  ebank_mysql_data:
