# ===================================================================
# DATABASE - MySQL (Banking Data: customers, accounts, operations)
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/E-BANK?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===================================================================
# SECURITY - JWT
# ===================================================================
jwt.secret=bXktc3VwZXItc2VjdXJlLWtleS1mb3Itand0LXNpZ25pbmctMjAyNg==

# ===================================================================
# SPRING AI - OpenAI
# ===================================================================
# Set the OPENAI_API_KEY environment variable before starting the app
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o
# Used by the EmbeddingModel to vectorize documents and queries for RAG
spring.ai.openai.embedding.options.model=text-embedding-ada-002

# ===================================================================
# SPRING AI - Vector Store
# ===================================================================
# PgVectorStore auto-configuration is disabled because the primary datasource
# is MySQL. A SimpleVectorStore bean is provided in DocumentIndexer instead.
# To switch to pgvector in production, comment this line and configure the
# pgvector datasource properties below, then update DocumentIndexer.java.
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

# Path of the JSON file where SimpleVectorStore persists its embeddings.
# The file is loaded at startup and saved after each ingestion.
app.vectorstore.path=src/main/resources/store/bank-store.json

# --- pgvector / PostgreSQL (for production) ---
